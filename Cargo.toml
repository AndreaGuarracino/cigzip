[package]
name = "cigzip"
version = "0.1.0"
edition = "2021"
authors = ["Andrea Guarracino <aguarracino@tgen.org>"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rust-htslib = { version = "1.0.0", default-features = false, features = ["libdeflate"] }
flate2 = "1.1"
log = "0.4"
env_logger = "0.11"
rayon = "1.10"
indicatif="0.18"
tikv-jemallocator = "0.6"
onecode = { git = "https://github.com/pangenome/onecode-rs" }

# Dependencies for AGC format (for sequences) support
ragc-core = { git = "https://github.com/ekg/ragc", rev = "40e5cad" }

lib_wfa2 = { git = "https://github.com/AndreaGuarracino/lib_wfa2", rev = "c61917a3705126567d04873f76273ac9b368afcc" }
#tracepoints = { path = "/home/guarracino/git/tracepoints"}
tracepoints = { git = "https://github.com/GuarracinoLab/tracepoints", rev = "059d6c355f4707a70268f41ec4a1a3b4d1d37c90" }
#tpa = { path = "/home/guarracino/git/tpa" }
tpa = { git = "https://github.com/AndreaGuarracino/tpa", rev = "a9ee80266922429107b81f3ca3683ed04d83e87a" }

[features]
default = []
sysmalloc = []
